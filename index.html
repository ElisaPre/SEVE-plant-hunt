<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>SEVE - The Plant Hunt</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* ---- Thème Firewatch intégré ---- */
    :root {
      --fw-bg: #2a0d00;
      --fw-dark: #1b0400;
      --fw-accent: #ff9b00;
      --fw-text: #fbe4b3;
      --fw-btn-hover: #ffb733;
      --fw-font: 'Oswald', sans-serif;
    }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: var(--fw-font);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--fw-bg);
      color: var(--fw-text);
      overflow-x: hidden;
    }

    /* --- Bannière (ancien header noir → version Firewatch) --- */
    header {
      background: var(--fw-dark);
      color: var(--fw-accent);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      box-sizing: border-box;
      border-bottom: 2px solid var(--fw-accent);
    }

    header a, header button {
      color: var(--fw-dark);
      text-decoration: none;
      background: var(--fw-accent);
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    header a:hover, header button:hover {
      background: var(--fw-btn-hover);
      color: var(--fw-dark);
    }

    /* --- Overlay Auth --- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-card {
      background: var(--fw-dark);
      color: var(--fw-text);
      padding: 40px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 6px 20px rgba(255, 155, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .auth-card input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--fw-accent);
      border-radius: 6px;
      background: #3b1c00;
      color: var(--fw-text);
    }

    .auth-card button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: var(--fw-accent);
      color: var(--fw-dark);
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }

    .auth-card button:hover {
      background: var(--fw-btn-hover);
    }

    /* --- Sections visuelles --- */
    .section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      text-align: center;
    }

    .section-white {
      background: var(--fw-dark);
      color: var(--fw-text);
    }

    .section-amber {
      background: #3b1c00;
      color: var(--fw-text);
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
      padding-left: 20px;
      padding-right: 20px;
      box-sizing: border-box;
    }

    .section-amber .text {
      width: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      padding-right: 10px;
      box-sizing: border-box;
    }

    .section-amber img {
      max-width: 400px;
      width: 50%;
      border-radius: 12px;
      padding-left: 7px;
      box-sizing: border-box;
      box-shadow: 0 0 15px rgba(255, 155, 0, 0.3);
    }

    /* --- Main Content --- */
    #main-content {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    #main-content h1 {
      color: var(--fw-accent);
      font-size: 2rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* --- Carrousel --- */
    .carousel-container {
      position: relative;
      width: 320px;
      height: 340px;
      margin: 40px auto;
      perspective: 1000px;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 320px;
      background: #4a1f00;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--fw-accent);
      transition: transform 0.6s ease, opacity 0.6s ease, filter 0.6s ease;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--fw-accent);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--fw-dark);
      z-index: 50;
      transition: 0.2s;
    }

    .carousel-btn:hover {
      background: var(--fw-btn-hover);
    }

    .carousel-btn.prev {
      left: -70px;
    }

    .carousel-btn.next {
      right: -70px;
    }

    /* --- Responsive --- */
    @media (max-width: 480px) {
      .carousel-container {
        width: 90vw;
        max-width: none;
        height: calc(70vw * 320 / 220);
        position: relative;
        margin: 40px auto;
      }

      .carousel-btn.prev {
        left: 5px;
      }

      .carousel-btn.next {
        right: 5px;
      }

      .card {
        width: 70vw;
        height: 100%;
        border-radius: 12px;
        box-sizing: border-box;
      }

      .carousel-track {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .carousel-container {
        margin-left: -3px;
      }
    }
  </style>
</head>
<body>

  <!-- Bannière noire avec boutons -->
  <header>
    <a href="admin-login.html">Admin</a>
    <button id="btn-signout">Se déconnecter</button>
  </header>

  <!-- Overlay Auth -->
  <div id="auth-overlay" class="overlay">
    <div class="auth-card">
      <h2>Connexion / Inscription</h2>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Mot de passe" />
      <button id="btn-signup">S'inscrire</button>
      <button id="btn-signin">Se connecter</button>
    </div>
  </div>

    <!-- Section blanche -->
    <div class="section section-white">
      <h2>Bienvenue Sur Les Traces de la Végétation !</h2>
    </div>

    <!-- Section ambrée avec image -->
    <div class="section section-amber">
      <div class="text">
        Ne t'aventure pas trop loin, la zone de recherche est juste ici !
      </div>
      <img src="Zone de recherche.png" alt="Carte du campus">
    </div>

  </div>

  <!-- Section carrousel des cartes -->
  <div class="section section-white">
    <div class="carousel-container">
      <button class="carousel-btn prev">&#10094;</button>
      <div class="carousel-track" id="carousel-track">
        <!-- Cartes générées par cards.js -->
      </div>
      <button class="carousel-btn next">&#10095;</button>
    </div>
  </div>

  <!-- Script du carrousel -->
  <script src="js/cards.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('auth-overlay');
      const mainContent = document.getElementById('main-content');
      const btnSignup = document.getElementById('btn-signup');
      const btnSignin = document.getElementById('btn-signin');
      const btnSignout = document.getElementById('btn-signout');

      // Vérifier si l'utilisateur est connecté
      auth.onAuthStateChanged(user => {
        if (user) {
          overlay.style.display = 'none';
          mainContent.style.display = 'flex';
        } else {
          overlay.style.display = 'flex';
          mainContent.style.display = 'none';
        }
      });

      // Inscription
      btnSignup.addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.createUserWithEmailAndPassword(email, password)
          .catch(error => alert(error.message));
      });

      // Connexion
      btnSignin.addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, password)
          .catch(error => alert(error.message));
      });

      // Déconnexion
      btnSignout.addEventListener('click', () => {
        auth.signOut();
      });
    });
  </script>
</body>
</html>
